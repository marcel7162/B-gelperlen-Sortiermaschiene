[platformio]
default_envs = ender_v427

[env:ender_v427]
platform = ststm32
board = genericSTM32F103RE
framework = arduino
monitor_speed = 115200

; Kein Bootloader – Firmware startet direkt bei 0x08000000
; HSE_VALUE: 8 MHz Quarz auf dem Ender 4.2.7 Board
build_flags =
    -Wl,--defsym=LD_FLASH_OFFSET=0x0
    -DVECT_TAB_OFFSET=0x0
    -DHSE_VALUE=8000000UL

; Upload via STLink – alternativ: serial, dfu
upload_protocol = stlink
; upload_port = /dev/ttyUSB0
