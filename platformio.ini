[platformio]
default_envs = ender_v427

[env:ender_v427]
platform = ststm32
board = genericSTM32F103RE
framework = arduino
monitor_speed = 115200

; Creality-Bootloader (SD-Karte) – App startet bei 0x08007000
build_flags =
    -Wl,--defsym=LD_FLASH_OFFSET=0x7000
    -DVECT_TAB_OFFSET=0x7000

; Upload via STLink – alternativ: serial, dfu
upload_protocol = stlink
; upload_port = /dev/ttyUSB0
